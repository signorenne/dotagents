name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate
        run: python3 tools/validate.py
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: python3 tools/build.py
